apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs554-midterm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs554-midterm
  template:
    metadata:
      labels:
        app: cs554-midterm
    spec:
      containers:
        - name: api
          image: cs554-midterm-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: cs554-midterm
            - name: MESSAGE
              value: Hello from my midterm service!
            - name: NOT_READY_FILE
              value: /tmp/midterm-not-ready
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            exec:
              command: ["wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 2

